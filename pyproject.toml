[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lambda-cdm"
version = "0.1.0"
description = "Lambda-CDM educational modeling toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "ruff>=0.6",
]

[tool.setuptools]
packages = ["Lambda_CDM", "Lambda_CDM.src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["N999"]

[tool.pytest.ini_options]
testpaths = ["tests"]
